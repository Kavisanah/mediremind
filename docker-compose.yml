version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mediremind_db
    restart: always
    environment:
      MYSQL_DATABASE: mediremind
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # Using the password from your .env file
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediremind_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # These override the values in your application.properties for the Docker environment
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/mediremind?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Note: For production, these should be passed in via an .env file, not hardcoded here!

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediremind_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
